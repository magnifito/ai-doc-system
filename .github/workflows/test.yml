name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The case-exactness and run-direct-guard code exists for platform
    # differences, so the suite runs where those differences live — not
    # only on Linux. Newer Node lines run on Linux to keep the matrix lean.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      # `impact --base origin/main` walks back to the merge base, so the shallow
      # default clone is not enough history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      # One gate step, not two: `--format github` exits exactly as the plain
      # run does and annotates the offending files on failure, so running the
      # gate twice only doubled the time it takes to fail.
      - run: npm run lint:docs -- --format github
      # The history-aware rules (`transition`, `promoted-verbatim`) need a base
      # ref, so this repository dogfoods them on every pull request.
      - run: node scripts/check-docs.mjs --base origin/main
        if: github.event_name == 'pull_request'
      - run: npm run lint:docs:advisory
      - run: node scripts/impact-docs.mjs --base origin/main
        if: github.event_name == 'pull_request'

  # The published artifact, not the working tree: pack the tarball, install it
  # into a fresh fixture repo, and run the CLI from node_modules. Catches
  # missing `files` entries and broken bin wiring that unit tests never see.
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: |
          set -eux
          TARBALL="$PWD/$(npm pack | tail -1)"
          FIXTURE=$(mktemp -d)
          cd "$FIXTURE"
          git init -q
          mkdir -p docs/engineering
          printf -- '---\ntitle: Smoke\nkind: engineering\nstatus: active\nupdated: 2026-08-27\n---\n\n# Smoke\n' \
            > docs/engineering/smoke.md
          npm init -y > /dev/null
          npm install "$TARBALL"
          # Missing `files` entry check: skills/ must ship, SKILL.md must not.
          # A root SKILL.md would make Claude Code ignore skills/ entirely, so the
          # negative half matters as much as the positive one.
          test -f node_modules/@puralex/ai-doc-system/skills/docs-gate/SKILL.md
          test ! -f node_modules/@puralex/ai-doc-system/SKILL.md
          npx ai-doc-system --version
          npx ai-doc-system gen
          npx ai-doc-system check
          npx ai-doc-system advisory
          # Every command the CLI exposes, driven from the INSTALLED tarball:
          # a `files` entry left out, or a script the dispatcher cannot reach,
          # shows up here and nowhere else.
          npx ai-doc-system new docs/product/hello.md --title Hello --summary "First doc."
          echo node_modules > .gitignore
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm smoke
          npx ai-doc-system mv docs/product/hello.md docs/engineering/hello.md
          npx ai-doc-system gen
          npx ai-doc-system check
          npx ai-doc-system verify
          npx ai-doc-system impact
          npx ai-doc-system context --kind engineering
          npx ai-doc-system export | head -1
